---
layout: default
background_image: "/images/glos1.png"
---

<section id="league" class="section py-4 py-md-5">
  <div class="container text-center text-black">
    
    <!-- Section Title -->
    <div class="d-inline-block pb-2 mb-4 mb-md-5 border-bottom border-4 border-dark">
      <h2 class="display-4 display-md-2 fw-bold mb-0 text-uppercase">
        Tournament Details
      </h2>
    </div>

    <!-- FIXED: Turned into a high-visibility red restriction container -->
    <div class="w-100 w-lg-75 mx-auto py-5 px-4 border border-2 border-danger rounded-4 shadow-sm" 
         style="background: linear-gradient(145deg, #fff5f5, #fee2e2); position: relative; overflow: hidden;">
      
      <!-- Subtle Decorative Background No-Entry Graphics -->
      <div class="text-danger opacity-25 position-absolute" style="top: -20px; left: -20px; font-size: 90px; pointer-events: none;">
        <i class="fa fa-ban"></i>
      </div>
      <div class="text-danger opacity-25 position-absolute" style="bottom: -20px; right: -20px; font-size: 90px; pointer-events: none;">
        <i class="fa fa-ban"></i>
      </div>

      <!-- Main Focal No-Entry Icon -->
      <div class="mb-3 text-danger drop-shadow" style="font-size: 48px;">
        <i class="fa fa-ban"></i>
      </div>
      
      <!-- Main text block -->
      <h3 class="display-5 fw-extrabold text-uppercase text-danger mb-2 tracking-wide">
        Nothing to see here
      </h3>
      <p class="fs-5 text-dark mb-0 mx-auto fw-medium" style="max-width: 600px; line-height: 1.6;">
        There are currently no discussions regarding a Gloucestershire Pickleball Tournament!
      </p>
    </div>
  </div>
</section>

<!-- Optional helper styles to make the red element pop -->
<style>
  .fw-extrabold { font-weight: 800; }
  .tracking-wide { letter-spacing: 0.05em; }
  .drop-shadow { filter: drop-shadow(0px 2px 4px rgba(220, 53, 69, 0.3)); }
</style>
