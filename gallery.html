---
layout: default
title: Gallery
background_image: ""
---

<section id="gallery" class="section py-5 mt-3">
  <div class="container text-center text-black">
    

    <!-- Filter Buttons Bar -->
    <div class="row mb-5">
        <div class="col-12 d-flex flex-wrap justify-content-center gap-2">
            <button class="btn btn-dark filter-btn active" data-filter="all">All Photos</button>
            <button class="btn btn-outline-dark filter-btn" data-filter="main">Main Highlights</button>
            <button class="btn btn-outline-dark filter-btn" data-filter="league">Leagues</button>
            <button class="btn btn-outline-dark filter-btn" data-filter="festival">Festivals</button>
            <button class="btn btn-outline-dark filter-btn" data-filter="socials">Socials</button>
            <button class="btn btn-outline-dark filter-btn" data-filter="graded-play">Graded Play</button>
        </div>
    </div>
    
    <!-- Responsive Dynamic Bootstrap Grid System -->
    <div class="row g-4 justify-content-center" id="gallery-grid">
      
      {% for item in site.data.gallery %}
      <!-- Dynamic Photo Card -->
      <div class="col-12 col-md-6 col-lg-4 gallery-item" data-category="{{ item.category }}">
        <div class="position-relative overflow-hidden rounded gallery-hover-wrapper shadow-sm" 
             data-bs-toggle="modal" 
             data-bs-target="#lightboxModal" 
             data-img-src="{{ '/images/Gallery/' | append: item.image | relative_url }}" 
             data-img-caption="{{ item.caption }}">
          
          <!-- Proportional Box -->
          <div class="ratio ratio-4x3">
            <img src="{{ '/images/Gallery/' | append: item.image | relative_url }}" 
                 alt="{{ item.alt }}" 
                 class="card-img-top object-fit-cover transition-img gallery-thumb"
                 loading="lazy">
          </div>

          <!-- Hover Overlay Mask -->
          <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center opacity-0 transition-overlay p-3">
            <p class="text-white fw-semibold mb-0 text-uppercase fs-6 tracking-wide text-center">{{ item.caption }}</p>
          </div>

        </div>
      </div>
      {% endfor %}

    </div> <!-- Closes #gallery-grid -->
  </div> <!-- Closes .container -->
</section>



<!-- Inline JavaScript for Filtering AND Lightbox Injection Logic -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // --- 1. FILTERING SYSTEM ---
    const buttons = document.querySelectorAll('.filter-btn');
    const items = document.querySelectorAll('.gallery-item');

    buttons.forEach(button => {
      button.addEventListener('click', function () {
        buttons.forEach(btn => {
          btn.classList.remove('btn-dark', 'active');
          btn.classList.add('btn-outline-dark');
        });
        this.classList.remove('btn-outline-dark');
        this.classList.add('btn-dark', 'active');

        const filterValue = this.getAttribute('data-filter');
        
        items.forEach(item => {
          if (filterValue === 'all' || item.querySelector('.gallery-hover-wrapper').getAttribute('data-category') === filterValue || item.getAttribute('data-category') === filterValue) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });


    });
  
</script>
