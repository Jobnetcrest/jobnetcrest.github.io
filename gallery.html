---
layout: default
background_image: ""
---


<section id="gallery" class="section py-5">
  <div class="container text-center text-black">
    
    <!-- 1. RESPONSIVE HEADER -->
    <header class="bg-transparent py-4 py-md-5 mt-md-2 w-100 px-3 text-center">
      <div class="mx-auto d-inline-block pb-2 pb-md-3 border-bottom border-4 border-dark max-w-100">
        <h1 class="display-4 display-md-1 fw-bold mb-0 text-uppercase text-black lh-sm">
          GALLERY
        </h1>
      </div>
    </header>

    <!-- Responsive Bootstrap Grid System -->
    <div class="row g-4 justify-content-center">
      
      <!-- Photo 1 -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="position-relative overflow-hidden rounded bg-dark gallery-hover-wrapper" style="cursor: pointer;">
          <img src="images/gallery 1.jpg" alt="Photo 1" class="img-fluid w-100 d-block object-fit-cover transition-img" style="height: 300px;">
          <!-- Bootstrap standard hover overlay mask -->
          <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-black bg-opacity-75 opacity-0 transition-overlay p-3">
            <p class="text-white fw-semibold mb-0 text-uppercase fs-6 tracking-wide">The only league that matters!</p>
          </div>
        </div>
      </div>

      <!-- Photo 2 -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="position-relative overflow-hidden rounded bg-dark gallery-hover-wrapper" style="cursor: pointer;">
          <img src="images/gallery 2.jpg" alt="Photo 2" class="img-fluid w-100 d-block object-fit-cover transition-img" style="height: 300px;">
          <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-black bg-opacity-75 opacity-0 transition-overlay p-3">
            <p class="text-white fw-semibold mb-0 text-uppercase fs-6 tracking-wide">First ladies session</p>
          </div>
        </div>
      </div>

      <!-- Photo 3 -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="position-relative overflow-hidden rounded bg-dark gallery-hover-wrapper" style="cursor: pointer;">
          <img src="images/gallery 3.jpg" alt="Photo 3" class="img-fluid w-100 d-block object-fit-cover transition-img" style="height: 300px;">
          <div class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-black bg-opacity-75 opacity-0 transition-overlay p-3">
            <p class="text-white fw-semibold mb-0 text-uppercase fs-6 tracking-wide">Everyone's a winner</p>
          </div>
        </div>
      </div>

      <!-- Continue adding more photo blocks here. The structural columns manage sizing dynamically. -->

    </div>
  </div>
</section>
