name: Automated Cookie Scanner Loop

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight
  workflow_dispatch: # Allows manual button-trigger from GitHub UI

jobs:
  audit-and-map:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright & System Binaries
        run: |
          npm list playwright || npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Headless Audit
        run: node scan.js

      - name: Push Data and Detect Changes
        id: git-push
        run: |
          git config --global user.name "CookieScannerBot"
          git config --global user.email "bot@github.com"
          
          git add cookie-database.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-updated active cookie catalog [skip ci]"
            git pull --rebase origin main
            git push
            echo "NEW_COOKIES_FOUND=true" >> $GITHUB_OUTPUT
            echo "Changes committed and pushed successfully."
          else
            echo "NEW_COOKIES_FOUND=false" >> $GITHUB_OUTPUT
            echo "No changes found in cookie profiles."
          fi

      - name: Email Notification - Success Alert
        if: success()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Cookie Scanner Completed Successfully"
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: "Cookie Scanner Bot <bot@github.com>"
          body: |
            The Automated Cookie Scanner completed its multi-page run successfully.
            New Cookies Detected and Logged: ${{ steps.git-push.outputs.NEW_COOKIES_FOUND }}
            
            Check your repository file `cookie-database.json` to review details.
