name: Automated Cookie Scanner Loop

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight
  workflow_dispatch: # Allows manual button-trigger from GitHub UI

jobs:
  audit-and-map:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright & System Binaries
        run: |
          npm list playwright || npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Headless Audit
        run: node scan.js

      - name: Execute Consent Lifecycle Verification Test
        # This will fail the build if rogue pixels fire before a user selects "Accept All"
        run: node verify-banner.js

      - name: Push Data back to Git
              # This step only runs if the compliance verification step passes success
        run: |
          git config --global user.name "CookieScannerBot"
          git config --global user.email "bot@github.com"
          
          git add cookie-database.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-updated active cookie catalog [skip ci]"
            git pull --rebase origin main
            git push
            echo "Changes committed and pushed successfully."
          else
            echo "No changes found in cookie profiles."
          fi

      - name: Archive Audited Cookie Database Artifact
        if: always() # Runs even if the verification script fails so you can inspect the file logs
        uses: actions/upload-artifact@v5
        with:
          name: audited-cookie-inventory
          path: cookie-database.json
          retention-days: 30
