name: Automated Cookie Scanner Loop

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight
  workflow_dispatch: # Allows manual button-trigger from GitHub UI

jobs:
  audit-and-map:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright & System Binaries
        run: |
          # Only install playwright if it's missing from package.json
          npm list playwright || npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Headless Audit
        run: node scan.js

      - name: Push Data Back to Git
        run: |
          git config --global user.name "CookieScannerBot"
          git config --global user.email "bot@github.com"
          
          # Force add if the folder structure was just generated
          git add cookie-database.json
          
          # Check for changes across both staged and untracked files reliably
          if [ -n "$(git status --porcelain cookie-database.json)" ]; then
            git commit -m "chore: auto-updated active cookie catalog [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes found in cookie profiles."
          fi


