name: Automated Cookie Scanner Loop

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight
  workflow_dispatch: # Allows manual button-trigger from GitHub UI

jobs:
  audit-and-map:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      # Fix: Bumped from @v4 to @v6 to run natively on Node 24
      - name: Checkout Codebase
        uses: actions/checkout@v6

      # Fix: Bumped from @v4 to @v6 to run natively on Node 24
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24' # Updated your execution environment to 24 as well
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Headless Audit
        run: node scan.js

      - name: Push Data Back to Git
        run: |
          git config --global user.name "CookieScannerBot"
          git config --global user.email "bot@github.com"
          git add public/cookie-database.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-updated active cookie catalog [skip ci]"
            git push
          else
            echo "No changes found in cookie profiles."
          fi

