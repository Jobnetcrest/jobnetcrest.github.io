---
layout: default
background_image: "/images/glos flag.png"
---

<!-- Main Content Area -->
<div class="container-fluid py-5 px-md-5 text-black">
  <div class="row g-4">

    <!-- 1. RESPONSIVE HEADER -->
    <div class="col-12">
      <header class="bg-transparent py-4 py-md-5 mt-md-2 w-100 px-3 text-center mb-2">
        <div class="mx-auto d-inline-block pb-2 pb-md-3 border-bottom border-4 border-dark max-w-100">
          <h1 class="display-4 display-md-2 fw-bold mb-0 text-uppercase text-black lh-sm tracking-wider">
            NEWS & UPDATES
          </h1>
        </div>
      </header>
    </div>
      
    <!-- 2. LEFT SIDE: SOCIAL FEED SECTION (Moved to LHS) -->
    <div class="col-12 col-lg-7">
      <h2 class="h4 fw-bold text-uppercase tracking-wide mb-3 pb-2 border-bottom border-dark border-2 d-inline-block">
        News & Social Updates
      </h2>
      
      <!-- Feed Wrapper Card -->
      <div class="card border border-dark border-2 shadow-sm overflow-hidden rounded-3" style="height: 700px;">
        <iframe 
          src="https://widgets.sociablekit.com/facebook-group-posts/iframe/25707462" 
          frameborder="0" 
          width="100%" 
          height="100%"
          style="display: block;"
          loading="lazy">
        </iframe>   
      </div>
    </div>

    <!-- 3. RIGHT SIDE: LIVE BLOG SECTION (Moved to RHS) -->
    <div class="col-12 col-lg-5">
      <h2 class="h4 fw-bold text-uppercase tracking-wide mb-3 pb-2 border-bottom border-dark border-2 d-inline-block">
        Live Blog
      </h2>
      <div class="card border border-dark border-2 shadow-sm overflow-hidden rounded-3">
        <!-- Frame integration targeting official club blog timeline -->
        <iframe 
          src="https://pickleballgloucestershire.blogspot.com/" 
          width="100%" 
          height="700px" 
          style="border:none; display: block;"
          loading="lazy">
        </iframe>
      </div>
    </div>

  </div> <!-- Closes Row -->
</div> <!-- Closes Container -->
