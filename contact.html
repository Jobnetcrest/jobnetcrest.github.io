---
layout: default
---



<section id="contact" class="section py-5">
  <div class="container text-center text-black">
    
    <!-- Clean, Solid Black Section Title (Matching Schedule & Gallery) -->
    <div class="d-inline-block pb-3 mb-5 border-bottom border-4 border-dark">
      <h2 class="display-2 fw-bold mb-0 text-uppercase">
        Contact Us
      </h2>
    </div>

    <!-- Layout Wrapper & Subtitle -->
    <div class="w-100 w-lg-75 mx-auto">
      <h3 class="fs-4 fw-normal mb-5 text-muted">
        For more information, we can be found at:
      </h3>

      <!-- Responsive Table Container -->
      <div class="table-responsive">
        
        <!-- Completely transparent, borderless table matching your Schedule section -->
        <table class="table table-borderless text-black align-middle fs-5" style="background: transparent;">
          
          <!-- Header Row with matching thicker line styling -->
          <thead class="border-bottom border-2 border-dark fw-bold text-uppercase fs-6">
            <tr>
              <th class="py-3 w-50">Method</th>
              <th class="py-3 w-50">Link</th>
            </tr>
          </thead>
          
          <!-- Contact Channels Body -->
          <tbody>
            <!-- Row 1: Email -->
            <tr class="border-bottom border-1 border-dark-subtle">
              <td class="py-4">Email</td>
              <td class="py-4">
                <a href="mailto:glospickle@gmail.com" 
                   class="text-primary fw-bold text-decoration-underline">
                  glospickle@gmail.com
                </a>
              </td>
            </tr>
            
            <!-- Row 2: WhatsApp -->
            <tr>
              <td class="py-4">WhatsApp</td>
              <td class="py-4">
                <a href="https://wa.me" 
                   target="_blank" 
                   class="text-primary fw-bold text-decoration-underline">
                  Chat on WhatsApp
                </a>
              </td>
            </tr>
          </tbody>

        </table>
      </div>

    </div>
  </div>
</section>
