---
layout: default
background_image: "/images/glos flag.png"
---

<section id="league" class="section py-4 py-md-5">
  <div class="container text-center text-black">
    
    <!-- Section Title -->
    <div class="d-inline-block pb-2 mb-4 mb-md-5 border-bottom border-4 border-dark">
      <h2 class="display-4 display-md-2 fw-bold mb-0 text-uppercase">
        League Details
      </h2>
    </div>

    <!-- FIXED: Turned into a high-visibility glowing yellow/gold announcement container -->
    <div class="w-100 w-lg-75 mx-auto py-5 px-4 border border-2 border-warning rounded-4 shadow-sm" 
         style="background: linear-gradient(145deg, #fffbeb, #fef08a); position: relative; overflow: hidden;">
      
      <!-- Subtle Decorative Background Star Graphics -->
      <div class="text-warning opacity-25 position-absolute" style="top: -20px; left: -20px; font-size: 90px; pointer-events: none;">
        <i class="fa fa-star"></i>
      </div>
      <div class="text-warning opacity-25 position-absolute" style="bottom: -20px; right: -20px; font-size: 90px; pointer-events: none;">
        <i class="fa fa-star"></i>
      </div>

      <!-- Main Focal Yellow Star Icon -->
      <div class="mb-3 text-warning drop-shadow" style="font-size: 48px;">
        <i class="fa fa-star animate-pulse"></i>
      </div>
      
      <!-- Main text block -->
      <h3 class="display-5 fw-extrabold text-uppercase text-dark mb-2 tracking-wide">
        Watch This Space
      </h3>
      <p class="fs-5 text-dark mb-0 mx-auto fw-medium" style="max-width: 600px; line-height: 1.6;">
        Discussions and planning are currently taking place regarding the next instalment of the Gloucestershire Pickleball League. Check back soon or join our announcement groups to be the first to know!
      </p>
    </div>

  </div>
</section>

<!-- Optional helper styles to make the yellow element pop -->
<style>
  .fw-extrabold { font-weight: 800; }
  .tracking-wide { letter-spacing: 0.05em; }
  .drop-shadow { filter: drop-shadow(0px 2px 4px rgba(217, 119, 6, 0.4)); }
</style>
